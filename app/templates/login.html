{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block public_content %}

<div class="lg-page">

    <div class="lg-wrapper">

        <section class="lg-card">

            <h1>Welcome back</h1>

            <p class="lg-intro">Log in to continue to your account.</p>

            {% if error %}
                <div class="lg-error">{{ error }}</div>
            {% endif %}

            {% if info %}
                <div class="lg-info">{{ info }}</div>
            {% endif %}

            <form method="post" action="/login">

                <div class="lg-field">
                    <label for="email">Gmail address</label>
                    <input type="email" id="email" name="email" value="{{ email }}"required>
                </div>

                <div class="lg-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button class="lg-button" type="submit">Log in</button>

            </form>

            <p class="lg-forgot">
                <a href="/forgot-password">Forgot password?</a>
            </p>

            <p class="lg-signup">
                New here? <a href="/signup">Create an account</a>
            </p>

        </section>

        <div class="lg-links">
            <a href="/">Home</a>
            <span>&nbsp;&middot;&nbsp;</span>
            <a href="/careers">Careers</a>
        </div>

    </div>

</div>

<style>

/* Soft page background */
.lg-page {
    min-height: calc(100vh - 64px);
    padding: 40px 20px 56px;
    background:
        radial-gradient(circle at 8% 12%, rgba(191, 219, 254, 0.35), transparent 24%),
        radial-gradient(circle at 92% 30%, rgba(224, 242, 254, 0.55), transparent 28%),
        #f5f9fd;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

.lg-wrapper {
    max-width: 460px;
    margin: 0 auto;
}

/* One white card */
.lg-card {
    position: relative;
    padding: 30px 32px 28px;
    background: #ffffff;
    border: 1px solid #e0eaf5;
    border-radius: 20px;
    box-shadow: 0 10px 28px rgba(30, 64, 100, 0.07);
    overflow: hidden;
}
.lg-card::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    right: -75px;
    top: -80px;
    background: #eef6ff;
    border-radius: 50%;
}
.lg-card > * { position: relative; z-index: 2; }

/* Headings and text */
.lg-card h1 {
    margin: 0 0 8px;
    color: #0f172a;
    font-size: 24px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: 0;
}
.lg-intro {
    margin: 0 0 20px;
    color: #64748b;
    font-size: 14px;
    line-height: 1.65;
}

/* Messages */
.lg-error,
.lg-info {
    margin-bottom: 18px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
}
.lg-error {
    background: #fff1f2;
    border: 1px solid #fecdd3;
    color: #be123c;
}
.lg-info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1d4ed8;
}

/* Fields */
.lg-field { margin-bottom: 16px; }

.lg-field label {
    display: block;
    margin-bottom: 6px;
    color: #334155;
    font-size: 14px;
    font-weight: 700;
}
.lg-field input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    background: #fbfdff;
    border: 1px solid #d6e0eb;
    border-radius: 12px;
    color: #172033;
    font-family: inherit;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.lg-field input::placeholder { color: #94a3b8; }
.lg-field input:focus {
    background: #ffffff;
    border-color: #7aa7e8;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
}

/* Button */
.lg-button {
    width: 100%;
    min-height: 46px;
    margin-top: 6px;
    background: #2563eb;
    color: #ffffff;
    border: 1px solid #2563eb;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.16);
    transition: background 0.2s ease, transform 0.2s ease;
}
.lg-button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
}

/* Forgot password and sign up */
.lg-forgot {
    margin: 16px 0 0;
    text-align: center;
    font-size: 13px;
}
.lg-forgot a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
}
.lg-forgot a:hover { text-decoration: underline; }

.lg-signup {
    margin: 16px 0 0;
    padding-top: 16px;
    border-top: 1px solid #e8eef5;
    color: #64748b;
    font-size: 13px;
    text-align: center;
}
.lg-signup a {
    color: #2563eb;
    font-weight: 700;
    text-decoration: none;
}
.lg-signup a:hover { text-decoration: underline; }

/* Bottom links */
.lg-links {
    padding-top: 18px;
    color: #64748b;
    font-size: 13px;
    text-align: center;
}
.lg-links a {
    color: #64748b;
    font-weight: 600;
    text-decoration: none;
}
.lg-links a:hover { color: #2563eb; }

/* Phones */
@media (max-width: 520px) {
    .lg-page { padding: 24px 12px 44px; }
    .lg-card { padding: 26px 20px 24px; border-radius: 16px; }
    .lg-card h1 { font-size: 22px; }
}

</style>

{% endblock %}
