{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}

{% block public_content %}
<section class="card form-card">
    <h1>Forgot your password?</h1>
    <p>Enter your Gmail address and we will send you a 6-digit code.</p>

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    {% if info %}<div class="info-box">{{ info }}</div>{% endif %}

    <form method="post" action="/forgot-password">
        <label for="email">Gmail address</label>
        <input type="email" id="email" name="email" value="{{ email }}" placeholder="Enter your Gmail address" required>
        <button class="btn" type="submit">Send code</button>
    </form>

    <p><a href="/login">&larr; Back to login</a></p>
</section>
{% endblock %}
